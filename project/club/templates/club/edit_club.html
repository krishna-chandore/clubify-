<!-- templates/club/edit_club.html -->
<!DOCTYPE html>
<html>
<head>
  <title>Edit Club</title>
</head>
<body>
  <h2>Edit {{ club.name }}</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <label>Name:</label>
    <input type="text" name="name" value="{{ club.name }}" required><br><br>

    <label>Description:</label>
    <textarea name="description" rows="5">{{ club.description }}</textarea><br><br>

    <label>Logo:</label>
    <input type="file" name="logo"><br><br>

    <button type="submit">Save</button>
  </form>
</body>
</html>
