<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Join Clubs</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="join-clubs.css" />
</head>
<body>
  <header>
    <div class="nav-container">
      <div class="logo">
        <img src="../src/LOGO.png" class="logo-img" alt="Logo" />
        <span class="logo-text">Clubify</span>
      </div>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="join-clubs.html" class="nav-link active">Join Clubs</a>
      </nav>
    </div>
  </header>

  <section class="club-grid">
    <div class="club-card">
      <img src="https://via.placeholder.com/300x180.png?text=Tech+Club" alt="Tech Club">
      <h3>Tech Club</h3>
      <p>Explore the world of coding, robotics, and innovation.</p>
      <!-- <button class="follow-btn" onclick="toggleFollow(this)">Follow</button> -->
      <a href="club-detail.html?club=tech" class="follow-btn">View Club</a>

    </div>
    <div class="club-card">
      <img src="https://via.placeholder.com/300x180.png?text=Music+Club" alt="Music Club">
      <h3>Music Club</h3>
      <p>Jam with fellow musicians and explore new sounds.</p>
      <!-- <button class="follow-btn" onclick="toggleFollow(this)">Follow</button> -->
      <a href="club-detail.html?club=tech" class="follow-btn">View Club</a>

    </div>
    <div class="club-card">
      <img src="https://via.placeholder.com/300x180.png?text=Drama+Club" alt="Drama Club">
      <h3>Drama Club</h3>
      <p>Perform, direct, and create stories on stage.</p>
      <!-- <button class="follow-btn" onclick="toggleFollow(this)">Follow</button> -->
      <a href="club-detail.html?club=tech" class="follow-btn">View Club</a>

    </div>
  </section>

  <script src="join-clubs.js"></script>
</body>
</html>
