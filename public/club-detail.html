<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Club Details</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="club-detail.css" />
</head>
<body>
  <header class="detail-header">
    <div class="nav-container">
      <div class="logo">
        <img src="..//src/LOGO.png" class="logo-img" alt="Logo" />
        <span class="logo-text">Clubify</span>
      </div>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="join-clubs.html" class="nav-link">Join Clubs</a>
      </nav>
    </div>
  </header>

  <section class="club-banner">
    <div class="banner-overlay">
      <img id="club-image" src="" class="club-avatar" alt="Club" />
      <div class="club-info">
        <h1 id="club-name">Loading...</h1>
        <button class="join-btn" id="join-btn">Join</button>
      </div>
    </div>
  </section>

  <main class="club-main">
    <section class="club-section">
      <h2>About the Club</h2>
      <p id="club-description"></p>
    </section>

    <section class="club-section">
      <h2>📌 Mission</h2>
      <p id="club-mission"></p>
    </section>

    <section class="club-section">
      <h2>🗓️ Past Events</h2>
      <ul id="club-events" class="event-list"></ul>
    </section>

    <section class="club-section">
      <h2>📸 Club Gallery</h2>
      <div class="media-grid" id="club-gallery"></div>
    </section>

    <section class="club-section">
      <h2>📄 Resources</h2>
      <ul id="club-resources" class="resource-list"></ul>
    </section>

    <section class="club-section">
      <h2>👤 Admin Info</h2>
      <p id="club-admin"></p>
    </section>
  </main>

  <script src="club-detail.js"></script>
</body>
</html>
